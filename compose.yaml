services:
  app:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHAT_DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support_copilot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    depends_on:
      phoenix:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  bot:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "bot"]
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      BOT_API_PORT: 9000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  redis_data: {}
  postgres_data: {}
  phoenix-data: {}
