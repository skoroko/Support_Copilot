services:
  app:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RERANKER: ${RAG_RERANKER_ENABLED:-false}
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    ports:
      - "${APP_HOST_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      APP_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHAT_DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support_copilot
      CHAT_REPOSITORY: postgres
      BOT_URL: http://bot:9000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RAG_DATA_DIR: /app/data
      RAG_INGEST_ON_START: ${RAG_INGEST_ON_START:-true}
      RAG_REBUILD_ON_START: "false"
    volumes:
      - ./data:/app/data
      - ./var:/app/var
    depends_on:
      phoenix:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RERANKER: ${RAG_RERANKER_ENABLED:-false}
    command: ["python", "-m", "bot"]
    ports:
      - "${BOT_HOST_PORT:-19000}:9000"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      BOT_API_PORT: 9000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  redis_data: {}
  qdrant_storage: {}
  pg-data: {}
  phoenix-data: {}
