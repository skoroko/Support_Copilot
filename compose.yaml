services:
  app:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RERANKER: ${RAG_RERANKER_ENABLED:-false}
        INSTALL_TRACING: ${TRACING_ENABLED:-false}
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    ports:
      - "${APP_HOST_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      APP_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHAT_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-support_copilot}"
      CHAT_REPOSITORY: postgres
      # LangGraph uses the same Postgres service/database as the chat module.
      AGENT_CHECKPOINTER: postgres
      AGENT_POSTGRES_URI: "postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-support_copilot}"
      LANGGRAPH_STRICT_MSGPACK: "true"
      BOT_URL: http://bot:9000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-support-copilot-rag}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      RAG_DATA_DIR: /app/data
      RAG_INGEST_ON_START: ${RAG_INGEST_ON_START:-true}
      RAG_REBUILD_ON_START: "false"
    volumes:
      - ./data:/app/data
      - ./var:/app/var
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RERANKER: ${RAG_RERANKER_ENABLED:-false}
        # app and bot intentionally use the same image tag, so their build args
        # must remain identical; otherwise the last build can replace the app
        # image with a variant that lacks tracing dependencies.
        INSTALL_TRACING: ${TRACING_ENABLED:-false}
    command: ["python", "-m", "bot"]
    ports:
      - "127.0.0.1:${BOT_HOST_PORT:-19000}:9000"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      BOT_API_PORT: 9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest@sha256:7c4c55c4b6feca40aa2aca334b1d107e1729a86bf99003f3609f0fbbe5ede225
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${PHOENIX_HTTP_PORT:-6006}:6006"
      - "127.0.0.1:${PHOENIX_GRPC_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  redis_data: {}
  qdrant_storage: {}
  pg-data: {}
  phoenix-data: {}
