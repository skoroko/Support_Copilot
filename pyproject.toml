[project]
name = "support-copilot"
version = "0.5.6"
requires-python = ">=3.13,<3.14"
dependencies = [
  "openai>=2.0.0,<3.0.0",
  "langgraph>=1.0,<2.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.1.14,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "aiosqlite>=0.20",
  "psycopg[binary,pool]>=3.2",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.7.0",
  "Jinja2>=3.1.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "fastapi>=0.110.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "sse-starlette>=2.0.0",
  "tenacity>=9.0.0",
  "uvicorn>=0.30.0",
  "aiogram>=3.0.0",
  "aiofiles>=23.2.0",
  "filelock>=3.32.0,<4",
  "SQLAlchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pypdf>=6.1.3,<7",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.1.0",
  "beautifulsoup4>=4.12.0",
  "qdrant-client==1.19.0",
  "tqdm>=4.66.0",
  "llama-index==0.14.24",
  "llama-index-vector-stores-qdrant==0.10.3",
  "llama-index-readers-file==0.7.0",
  "pylibmspack==0.4.0",
  "numpy>=1.26.0",
  "redis>=5.0.0",
  "structlog>=24.0.0",
]

[project.optional-dependencies]
eval = [
  "ragas>=0.4,<0.5",
  "langchain-community<0.4",
  "anthropic>=0.40",
  "pandas>=2",
  "rapidfuzz>=3",
]
tracing = [
  "arize-phoenix-otel>=0.16.0",
  "openinference-instrumentation-openai>=0.1.0",
  "openinference-instrumentation-llama-index>=4.4,<5",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp>=1.28",
]
reranker = [
  "sentence-transformers>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.12.0",
]

[tool.uv]
package = false
